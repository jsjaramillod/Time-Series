[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "common-signals"
version = "0.1.0"
description = "Common signals, high-dimensional forecasts and identified technology shocks"
requires-python = ">=3.11"
dependencies = ["payroll-risk==0.1.0", "scipy>=1.12,<2", "pandas>=2.2,<4", "numpy>=1.26,<3"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.9,<1", "ipykernel>=6,<8", "nbformat>=5,<6", "nbclient>=0.10,<1", "reportlab>=4,<5"]

[tool.ruff]
line-length = 100
[tool.ruff.lint]
select = ["E4","E7","E9","F","I"]
