name: Project 02 validation
on:
  push:
    paths: ["project2/**", ".github/workflows/project2.yml"]
  pull_request:
    paths: ["project2/**", ".github/workflows/project2.yml"]
permissions:
  contents: read
jobs:
  scientific-controls:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: project2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e '.[dev]'
      - run: ruff check src tests
      - run: pytest -q
