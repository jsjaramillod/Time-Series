[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "payroll-risk"
version = "0.1.0"
description = "Monthly US payroll forecasts with nested Bayesian information sets"
requires-python = ">=3.11"
dependencies = ["bayes-policy==0.1.0", "numpy>=1.26,<3", "pandas>=2.2,<4", "scipy>=1.12,<2", "openpyxl>=3.1,<4", "matplotlib>=3.8,<4"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.9,<1", "nbformat>=5,<6", "nbclient>=0.10,<1", "ipykernel>=6,<8", "reportlab>=4,<5"]

[project.scripts]
payroll-risk = "payroll_risk.study:main"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4","E7","E9","F","I"]
