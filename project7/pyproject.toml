[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "payroll-volatility"
version = "0.1.0"
description = "Six-month payroll forecasts with temporary pandemic volatility"
requires-python = ">=3.11"
dependencies = ["payroll-risk==0.1.0"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.9,<1", "nbformat>=5,<6", "nbclient>=0.10,<1", "ipykernel>=6,<8", "reportlab>=4,<5"]

[project.scripts]
payroll-volatility = "payroll_volatility.study:main"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4","E7","E9","F","I"]
